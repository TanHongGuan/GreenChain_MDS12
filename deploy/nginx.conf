server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API is served from the same origin under /api, so a frontend built with
    # VITE_API_BASE_URL=/api works from any machine that can reach this host, and the
    # session cookie is first-party (no cross-origin CORS or third-party cookie issues).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads are capped by the API (MAX_UPLOAD_SIZE_MB, default 25); allow a little
        # multipart overhead so nginx does not reject them first.
        client_max_body_size 30m;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # browsers keep loading the previous deploy's asset names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
